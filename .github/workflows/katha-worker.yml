# Katha render worker. Set up automatically by `python -m katha.cloud.roster add <id>` (nothing to do by hand).
# Each run is short (a few minutes): download the Katha code from the orchestrator, heartbeat, then submit/collect/claim one chunk.
# Rendering happens on Kaggle.
# Secrets:
#   KAGGLE_API_TOKEN     – this account's Kaggle API token
#   KATHA_WORKER_TOKEN   – the worker token the orchestrator issued for this account
#   AGNES_API_KEY        – owner only: lets this worker paint the shot images (Agnes blocks Cloudflare servers)
# Variables:
#   KAGGLE_USERNAME      – this account's Kaggle username
#   KATHA_ORCH_URL       – orchestrator URL, e.g. https://katha-orchestrator.<name>.workers.dev
#   KATHA_QUOTA_REMAINING_H (optional) – hours left on your Kaggle quota page, if the estimate drifts
#   KATHA_CAN_ASSEMBLE (optional, owner only) – "1"
name: katha-worker
on:
  schedule:
    - cron: "*/20 * * * *"        # every 20 minutes; idle runs exit in ~1 minute
  workflow_dispatch: {}
concurrency:
  group: katha-worker              # never two passes at once for the same account
  cancel-in-progress: false
jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: get Katha code from the orchestrator   # the owner publishes it there; no access to the private code repo needed
        env:
          KATHA_WORKER_TOKEN: ${{ secrets.KATHA_WORKER_TOKEN }}
          KATHA_ORCH_URL: ${{ vars.KATHA_ORCH_URL }}
        run: |
          curl -fsS --retry 3 -H "Authorization: Bearer $KATHA_WORKER_TOKEN" "$KATHA_ORCH_URL/api/worker/code" -o katha.zip
          unzip -q -o katha.zip && rm katha.zip && ls katha/cloud/worker.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "kaggle>=1.8" six pillow
      - name: worker pass
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          KATHA_WORKER_TOKEN: ${{ secrets.KATHA_WORKER_TOKEN }}
          KATHA_ORCH_URL: ${{ vars.KATHA_ORCH_URL }}
          KATHA_QUOTA_REMAINING_H: ${{ vars.KATHA_QUOTA_REMAINING_H }}
          KATHA_CAN_ASSEMBLE: ${{ vars.KATHA_CAN_ASSEMBLE }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          [ -d katha ] || cd katha-studio      # code may sit at the repo root or in katha-studio/
          python -m katha.cloud.worker
